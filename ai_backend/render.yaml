services:
  - type: web
    name: minutecraftai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-api.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: MISTRAL_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: WHISPER_MODEL
        value: small
      - key: SARVAM_STT_MODEL
        value: saaras:v2.5
